name: Build launcher

# Started by hand: Actions tab -> Build launcher -> Run workflow.
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: >
          dotnet publish launcher/windows/BloodborneLauncher/BloodborneLauncher.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:Version=0.9.37 -p:InformationalVersion=0.9.37
          -o build-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-Engine-launcher
          path: build-launcher
